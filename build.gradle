plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'cz.trixi'
version = '0.0.1-SNAPSHOT'

// newer than the version managed by Spring Boot 3.5.5 (1.21.3), which talks to the Docker API
// as 1.32 and is rejected by Docker 29 ("client version 1.32 is too old")
ext['testcontainers.version'] = '1.21.4'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// only the executable Spring Boot jar is needed
tasks.named('jar') {
    enabled = false
}

tasks.named('test') {
    useJUnitPlatform()
}
