services:
  db:
    # PostGIS for the geometry columns; the official postgis/postgis image has no arm64 build
    image: imresamu/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: ruian
      POSTGRES_USER: ruian
      POSTGRES_PASSWORD: ruian
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # the schema is created once, when the database volume is initialized
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruian -d ruian"]
      interval: 2s
      timeout: 5s
      retries: 15

  importer:
    build: .
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ruian
      SPRING_DATASOURCE_USERNAME: ruian
      SPRING_DATASOURCE_PASSWORD: ruian
      # passed through only when set, defaults are in application.yml
      IMPORTER_DEFAULT_SOURCE:
      IMPORTER_SCHEDULE_CRON:

volumes:
  db-data:
